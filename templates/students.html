<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Students</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;
      color: #111;
      margin: 2rem;
    }
  </style>
</head>
<body>
  <h1>Students</h1>
  {% if names %}
  <ul>
    {% for name in names %}
    <li>{{ name }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No students found.</p>
  {% endif %}
</body>
</html>
